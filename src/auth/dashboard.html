<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Image to Text OCR</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="../icons/icon128.png" alt="" width="26" height="26">
        <span class="brand-name">Image to Text OCR</span>
        <span class="brand-tag">Dashboard</span>
      </div>
      <nav class="topnav" aria-label="Dashboard menu">
        <a href="dashboard.html" class="topnav-link active" aria-current="page">History</a>
        <a href="settings.html" class="topnav-link">Settings</a>
      </nav>
      <div class="user-menu">
        <span id="avatar" class="avatar">?</span>
        <span id="user-email" class="user-email"></span>
        <button id="sign-out-btn" class="btn ghost">Sign out</button>
      </div>
    </div>
  </header>

  <main class="dash">
    <div id="sync-error" class="sync-error hidden" role="alert">
      <span id="sync-error-text" class="sync-error-text"></span>
      <button id="sync-retry-btn" class="btn danger-outline auto">Retry sync</button>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="panel-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg></span>
          <h2>History</h2>
        </div>
        <span id="stats" class="stats"></span>
      </div>
      <div class="filters">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20 20"/></svg>
          <input type="text" id="search-input" placeholder="Search text…" aria-label="Search history text">
        </div>
        <select id="filter-language" aria-label="Filter by language">
          <option value="all">All Languages</option>
          <option value="eng">English</option>
          <option value="hin">Hindi</option>
          <option value="spa">Spanish</option>
          <option value="fra">French</option>
          <option value="deu">German</option>
          <option value="jpn">Japanese</option>
          <option value="chi_sim">Chinese (Simplified)</option>
        </select>
        <button id="clear-history-btn" class="btn ghost danger-text">Clear all</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>

  <div id="detail-modal" class="modal hidden">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span id="detail-meta" class="modal-meta"></span>
        <button id="modal-close" class="icon-btn" title="Close">×</button>
      </div>
      <div id="detail-text" class="modal-text"></div>
      <div class="modal-actions">
        <button id="copy-detail-btn" class="btn primary auto">Copy Text</button>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
