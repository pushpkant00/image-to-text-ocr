<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Image to Text OCR</h1>
      <button id="view-history-btn" class="link-btn" type="button">History</button>
    </div>

    <label class="file-btn">Upload Image File
      <input type="file" id="ocr-file" accept="image/*" hidden>
    </label>
    <p class="hint">Or press <b>Ctrl</b>+<b>Shift</b>+<b>X</b> and drag over the text &nbsp;·&nbsp; paste a screenshot with <b>Ctrl</b>+<b>V</b></p>

    <div id="ocr-status" class="status hidden"></div>

    <div class="settings">
      <select id="language-select" aria-label="OCR language">
        <option value="eng" selected>English (offline)</option>
        <option value="hin">Hindi</option>
        <option value="spa">Spanish</option>
        <option value="fra">French</option>
        <option value="deu">German</option>
        <option value="jpn">Japanese</option>
        <option value="chi_sim">Chinese (Simplified)</option>
      </select>
      <label><input type="checkbox" id="remove-breaks" checked> Clean up line breaks</label>
      <label><input type="checkbox" id="merge-spaces" checked> Merge extra spaces</label>
    </div>

    <div id="last-result" class="result-box hidden">
      <div class="result-head">
        <span class="result-title">Last Result</span>
        <span id="last-accuracy" class="accuracy-badge"></span>
      </div>
      <div id="last-text" class="result-line"></div>
      <button id="copy-last-btn" class="result-btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span></button>
    </div>

    <p class="shortcut">Right-click any image → “Extract text from this image”</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
